<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>All Banners Preview</title>
	<style>
		@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: 'pretendard', sans-serif;
			background-color: #f4f5f7;
			padding: 50px;
		}

		.section {
			margin-bottom: 60px;
		}

		.section-title {
			font-size: 24px;
			font-weight: 800;
			color: #1a1a1a;
			margin-bottom: 30px;
			padding-bottom: 12px;
			border-bottom: 1px solid #e0e0e0;
		}

		.banner-grid {
			display: flex;
			flex-wrap: wrap;
			gap: 40px;
			justify-content: flex-start;
			align-items: flex-start;
		}

		.banner-container {
			display: flex;
			flex-direction: column;
			align-items: center;
			background: #ffffff;
			padding: 30px;
			border-radius: 16px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
			transition: transform 0.2s ease;
		}

		.banner-container:hover {
			transform: translateY(-5px);
		}

		.banner-title {
			font-size: 18px;
			font-weight: 700;
			margin-bottom: 20px;
			color: #1a1a1a;
			letter-spacing: -0.5px;
		}

		iframe {
			border: 1px solid #eaeaea;
			border-radius: 4px;
			background-color: #fff;
		}
	</style>
</head>

<body>
	<div class="section">
		<h2 class="section-title">Google RTB 상품형 배너 (할인X)</h2>
		<div class="banner-grid">
			<div class="banner-container">
				<div class="banner-title">336 x 280</div>
				<iframe src="336x280_2.html" width="336" height="280" scrolling="no"></iframe>
			</div>

			<div class="banner-container">
				<div class="banner-title">320 x 100</div>
				<iframe src="320x100_2.html" width="320" height="100" scrolling="no"></iframe>
			</div>

			<div class="banner-container">
				<div class="banner-title">300 x 50</div>
				<iframe src="300x50_2.html" width="300" height="50" scrolling="no"></iframe>
			</div>

			<div class="banner-container">
				<div class="banner-title">234 x 60</div>
				<iframe src="234x60_2.html" width="234" height="60" scrolling="no"></iframe>
			</div>
		</div>
	</div>
</body>

</html>
