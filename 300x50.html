<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<style>
	/* font */
	@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

	/* Normalize */
	* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
	}

	.mobon_reset {
		width: 300px;
		height: 50px;
		font-family: "pretendard";
		overflow: hidden;
		cursor: pointer;
	}

	.mobon_banner {
		position: relative;
		width: 100%;
		height: 100%;
		display: flex;
	}

	.img {
		flex-shrink: 0;
		width: 50px;
		height: 100%;
		object-fit: cover;
	}

	.bg {
		flex: 1;
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 5px;
		min-width: 0;
		background-color: #121214;
		padding: 0 10px;
	}

	.text_wrap {
		display: flex;
		flex-direction: column;
		justify-content: center;
		min-width: 0;
	}

	.pnm_wrap {
		display: flex;
		font-size: 11px;
		font-weight: 500;
		letter-spacing: -0.24px;
		color: #d8d4cd;
	}

	.badge {
		display: flex;
		font-size: 9px;
	}

	.dot {
		width: 6px;
		height: 6px;
		border-radius: 50%;
		background-color: #ff3b30;
		animation: blink 1.2s infinite;
		margin-top: 3px;
		margin-right: 4px;
	}

	@keyframes blink {

		0%,
		100% {
			opacity: 1;
		}

		50% {
			opacity: 0;
		}
	}

	.pnm {
		flex: 1;
		min-width: 0;
		white-space: nowrap;
		text-overflow: ellipsis;
		overflow: hidden;
	}

	.price_box {
		display: flex;
		align-items: baseline;
		column-gap: 5px;
		margin-top: 1px;
	}

	.price_box.sale .sale_rate,
	.price_box.sale .original_price {
		display: block;
	}

	.sale_rate {
		display: none;
		font-size: 13px;
		font-weight: bold;
		letter-spacing: -0.6px;
		color: #e8c66a;
	}

	.sale_rate span {
		font-size: 10px;
	}

	.final_price {
		font-size: 14px;
		letter-spacing: -0.6px;
		font-weight: bold;
		color: #ffffff;
	}

	.original_price {
		display: none;
		font-size: 10px;
		font-weight: 500;
		color: #7d7871;
		text-decoration: line-through;
	}

	.shop_btn {
		position: relative;
		flex-shrink: 0;
		height: 20px;
		font-family: inherit;
		font-size: 10px;
		font-weight: 500;
		color: #f0e2b8;
		border: 1px solid #e8c66a;
		background-color: transparent;
		padding: 0 6px;
		overflow: hidden;
	}

	.shop_btn::after {
		content: "";
		position: absolute;
		top: 0;
		bottom: 0;
		left: -40px;
		width: 20px;
		pointer-events: none;
		background: linear-gradient(100deg,
				rgba(255, 255, 255, 0) 0%,
				rgba(255, 255, 255, 0.28) 50%,
				rgba(255, 255, 255, 0) 100%);
		animation: shine 2.8s ease-in-out infinite;
	}

	@keyframes shine {
		0% {
			left: -40px;
		}

		55%,
		100% {
			left: 100%;
		}
	}
</style>

<body>
	<div class="mobon_reset">
		<div class="mobon_banner">
			<div id="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
			<img class="img" src="https://www.dabagirl.co.kr/web/product/big/202105/04ff60dbb9fa51e3c47fc8e4bdc27c08.jpg" alt="배너이미지">
			<div class="bg">
				<div class="text_wrap">
					<div class="pnm_wrap">
						<span class="badge"><span class="dot"></span>오늘 마감 &middot;&nbsp;</span>
						<p class="pnm">쿨링 썸머 카라넥 원피스</p>
					</div>
					<!-- 할인가 있으면 .sale 추가 -->
					<div class="price_box sale">
						<div class="sale_rate">32<span>%</span></div>
						<div class="final_price">39,900원</div>
						<div class="original_price">49,900원</div>
					</div>
				</div>
				<button type="button" class="shop_btn">최저가 구매</button>
			</div>
		</div>
	</div>
</body>

</html>
