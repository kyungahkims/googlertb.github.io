<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>구글RTB 배너</title>
</head>
<style>
	:root {
		--width: 234px;
		--height: 60px;
	}

	/* Normalize */
	* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
	}

	.mobon_reset {
		width: var(--width);
		height: var(--height);
		overflow: hidden;
		cursor: pointer;
	}

	.mobon_banner {
		position: relative;
		width: 100%;
		height: 100%;
	}

	.img {
		width: 100%;
		height: 100%;
		object-fit: contain;
	}
</style>

<body>
	<div class="mobon_reset">
		<div class="mobon_banner">
			<div id="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
			<img class="img" src="https://img.mobon.net/Frtb/images/preview/720x120/cuu720x120.png"
				alt="배너이미지">
		</div>
	</div>
</body>

</html>
